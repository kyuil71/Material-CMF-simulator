<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>불릿 라이트 CMF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  --ink:#1c1d20; --sub:#5d6066; --line:rgba(0,0,0,.12);
  --panel:rgba(236,236,233,.88); --chip:rgba(255,255,255,.6); --chipOn:#1c1d20; --chipOnInk:#f1f1ee;
  --cold:#3e5a8a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#e4e3df; --sub:#9a9ca1; --line:rgba(255,255,255,.12);
    --panel:rgba(22,23,26,.84); --chip:rgba(255,255,255,.05); --chipOn:#e6eeff; --chipOnInk:#15161a;
    --cold:#bcd0f5;
  }
}
:root[data-theme="dark"]{
  --ink:#e4e3df; --sub:#9a9ca1; --line:rgba(255,255,255,.12);
  --panel:rgba(22,23,26,.84); --chip:rgba(255,255,255,.05); --chipOn:#e6eeff; --chipOnInk:#15161a;
  --cold:#bcd0f5;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{margin:0;height:100%;overflow:hidden;background:#050506;color:var(--ink);
  font-family:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cold);outline-offset:2px}

.top{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:3}
.title{pointer-events:auto;min-width:0;flex:1;margin-right:12px;color:#e4e3df;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.light-bg .title{color:#1c1d20;text-shadow:none}
.light-bg .title span{color:#5d6066}
.title b{display:block;font-weight:600;font-size:18px;letter-spacing:-.01em}
.title span{font-size:16px;color:#a8aab0;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reset{pointer-events:auto;flex:none;border:1px solid rgba(255,255,255,.18);background:rgba(20,21,24,.7);color:#e4e3df;border-radius:999px;padding:6px 16px;min-height:38px;font-size:16px;cursor:pointer;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.seg{pointer-events:auto;flex:none;display:flex;background:rgba(20,21,24,.7);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:3px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.seg button{white-space:nowrap;border:0;background:none;color:#cfd0d3;padding:6px 12px;border-radius:999px;font-size:16px;cursor:pointer;min-height:36px}
.seg button[aria-pressed="true"]{background:#e6eeff;color:#15161a}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:4;display:flex;justify-content:center;pointer-events:none}
.sheet{pointer-events:auto;width:100%;max-width:430px;background:var(--panel);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);
  border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding:12px 0 calc(env(safe-area-inset-bottom,0px) + 12px);max-height:58vh;display:flex;flex-direction:column}
@media (min-width:900px){.dock{justify-content:flex-end;bottom:16px;right:16px;left:auto}.sheet{border-radius:20px;border:1px solid var(--line);width:400px;max-height:calc(100vh - 120px)}}
.handle{display:flex;align-items:center;gap:6px;padding:0 10px 10px;touch-action:none;user-select:none}
.grip{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;cursor:pointer;padding:2px 0;min-height:44px;justify-content:center}
.grip::before{content:"";width:40px;height:5px;border-radius:3px;background:var(--sub);opacity:.6}
.grip span{font-size:20px;font-weight:600;letter-spacing:-.01em;line-height:1.2;transition:opacity .3s}
.grip span.swap{opacity:0}
.grip small{font-size:14px;color:var(--sub);line-height:1.3;text-align:center}
.nav{border:1px solid var(--line);background:var(--chip);border-radius:12px;width:44px;height:44px;font-size:18px;cursor:pointer;flex:none}
.sheet .body{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.sheet.collapsed .body{display:none}
.sheet.collapsed{padding-top:8px}
.sheet.collapsed .grip small{display:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 16px 10px;justify-content:space-between;scrollbar-width:none}
.chips[hidden]{display:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:grid;place-items:center;width:34px;height:34px;border:1px solid var(--line);background:var(--chip);border-radius:50%;padding:0;cursor:pointer;font-size:14px;font-variant-numeric:tabular-nums}
.chip.cust{box-shadow:inset 0 -3px 0 var(--cold)}
.chip i{width:28px;height:28px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.chip b{font-size:13px;font-weight:500;color:var(--sub);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"] b{color:inherit;opacity:.6}
.chip span{display:block;font-size:16px;white-space:nowrap;line-height:1.25}
.chip small{display:block;font-size:13px;color:var(--sub);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--chipOn);color:var(--chipOnInk);border-color:transparent}
.chip[aria-pressed="true"] small{color:inherit;opacity:.7}

.tabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;padding:8px 4px;font-size:16px;color:var(--sub);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.pane{overflow-y:auto;padding:12px 16px 4px;-webkit-overflow-scrolling:touch}
.pane[hidden]{display:none}

.row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.pill{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:6px 14px;font-size:16px;cursor:pointer;min-height:38px;display:inline-flex;align-items:center;gap:8px}
.pill[aria-pressed="true"]{background:var(--chipOn);color:var(--chipOnInk);border-color:transparent}
.pill .dot{width:14px;height:14px;border-radius:50%;box-shadow:0 0 8px currentColor}
.pill:disabled{opacity:.4;cursor:default}
.grp{font-size:14px;color:var(--sub);margin:6px 0 6px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hd .pill{min-height:34px;padding:4px 12px;font-size:14px}
.sl{display:grid;grid-template-columns:96px 1fr 52px;align-items:center;gap:10px;margin:6px 0}
.sl label{font-size:16px}
.sl output{font-size:14px;color:var(--sub);text-align:right;font-variant-numeric:tabular-nums}
.sl.dis{opacity:.4}
.col{display:grid;grid-template-columns:96px 1fr auto;align-items:center;gap:10px;margin:6px 0 10px}
.col input[type=color]{width:100%;height:38px;border:1px solid var(--line);border-radius:10px;background:none;padding:2px;cursor:pointer}
input[type=range]{width:100%;accent-color:var(--cold);height:28px}
.box{transition:opacity .2s}
.box.off{opacity:.4;pointer-events:none}
.note{margin:8px 0 6px;font-size:14px;color:var(--sub);border-left:2px solid var(--cold);padding-left:10px}

#load{position:fixed;inset:0;display:grid;place-items:center;color:#9a9ca1;font-size:16px;z-index:9;background:#050506;transition:opacity .6s}
#load.done{opacity:0;pointer-events:none}
@media (prefers-reduced-motion: reduce){#load{transition:none}}
</style>
</head>
<body>
<canvas id="c" aria-label="총알형 조명 3D 뷰어"></canvas>
<div id="load">셰이더를 준비하는 중…</div>

<header class="top">
  <div class="title"><b>불릿 라이트 CMF</b><span id="hdrSub"></span></div>
  <button class="reset" id="reset">초기화</button>
</header>

<div class="dock"><section class="sheet" id="sheet">
  <div class="handle" id="handle">
    <button class="nav" id="prev" aria-label="이전 프리셋">‹</button>
    <button class="grip" id="grip" aria-expanded="true" aria-controls="sheetBody">
      <span id="gripName"></span><small id="gripHint"></small>
    </button>
    <button class="nav" id="next" aria-label="다음 프리셋">›</button>
  </div>
  <div class="body" id="sheetBody">
    <div class="chips" id="chips" role="group" aria-label="단계" hidden></div>
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-p="pLight">빛</button>
      <button role="tab" aria-selected="false" data-p="pIn">안쪽 레이어</button>
      <button role="tab" aria-selected="false" data-p="pOut">바깥 레이어</button>
      <button role="tab" aria-selected="false" data-p="pEnv">환경</button>
    </div>
    <div class="pane" id="pLight">
      <p class="grp">내부 빛 색</p>
      <div class="row" id="lightRow"></div>
      <div class="sl"><label for="sLI">빛 세기</label><input id="sLI" type="range" min="0" max="100" step="1"><output id="oLI"></output></div>
      <div class="sl"><label for="sBloom">빛 번짐</label><input id="sBloom" type="range" min="0" max="2" step="0.05"><output id="oBloom"></output></div>
      <p class="note">빛은 중심축의 LED 바에서 나옵니다. 안쪽 레이어를 통과한 빛(천공·투광)만 바깥 레이어에 닿고, 바깥 천공으로 새어 나온 빛은 바닥에 점 무늬로 맺힙니다.</p>
    </div>
    <div class="pane" id="pIn" hidden></div>
    <div class="pane" id="pOut" hidden></div>
    <div class="pane" id="pEnv" hidden>
      <p class="grp">배경</p>
      <div class="row" id="bgRow"></div>
      <div class="sl"><label for="sGap">레이어 간격</label><input id="sGap" type="range" min="2" max="20" step="0.5"><output id="oGap"></output></div>
      <div class="sl"><label for="sEnvL">주변광</label><input id="sEnvL" type="range" min="0" max="1.5" step="0.05"><output id="oEnvL"></output></div>
      <div class="sl"><label for="sExp">노출</label><input id="sExp" type="range" min="0.3" max="2.5" step="0.05"><output id="oExp"></output></div>
      <p class="grp">시점·움직임</p>
      <div class="row">
        <button class="pill" id="vFront">정면</button>
        <button class="pill" id="vHigh">위에서</button>
        <button class="pill" id="vLow">낮게</button>
        <button class="pill" id="tRot" aria-pressed="false">자동 회전</button>
      </div>
      <p class="note">지름 100 mm · 높이 약 195 mm 기준. 드래그로 360° 회전, 두 손가락으로 확대·축소합니다.</p>
    </div>
  </div>
</section></div>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ───────── 치수 (1 unit = 100 mm) ───────── */
const SC = 0.01;            // mm → unit
const H  = 1.45;            // 원통부 높이 145 mm
const RO = 0.5;             // 바깥 반지름 50 mm
const EY0 = 0.10, EY1 = H + 0.08;   // LED 바 범위

/* ───────── 데이터 ───────── */
const LIGHTS = {
  white:  {name:'화이트', css:'#f4f2ee', rgb:[1.00,0.96,0.90]},
  yellow: {name:'옐로',   css:'#ffc24a', rgb:[1.00,0.70,0.26]},
  blue:   {name:'블루',   css:'#4f86ff', rgb:[0.22,0.48,1.00]},
  green:  {name:'그린',   css:'#4cf27a', rgb:[0.28,1.00,0.42]},
};
const MATS = {
  glass:  {name:'유리',     idx:0, color:'#ffffff', t:.85, g:.95, tl:'투명도'},
  plastic:{name:'플라스틱', idx:1, color:'#f4f1ea', t:.30, g:.60, tl:'투명도'},
  metal:  {name:'메탈',     idx:2, color:'#c9ccd1', t:0,   g:.55, tl:'투광도'},
  wood:   {name:'나무',     idx:3, color:'#b98552', t:.20, g:.35, tl:'투광도'},
  marble: {name:'대리석',   idx:4, color:'#efebe4', t:.35, g:.85, tl:'투광도'},
  fabric: {name:'패브릭',   idx:5, color:'#d8d0c2', t:.35, g:.10, tl:'성김'},
};
const DISTS = [['균일',0],['위로 커짐',1],['아래로 커짐',2],['랜덤',3],['가운데 큼',4],['위아래 큼',5],['군집',6]];
const BGS = {
  black:{name:'블랙', bg:'#050506', floor:'#0c0d0f', light:false},
  gray: {name:'다크 그레이', bg:'#202226', floor:'#2a2c31', light:false},
  white:{name:'스튜디오 화이트', bg:'#e6e6e2', floor:'#d9d9d4', light:true},
};

const layerDef = (mat, o={}) => Object.assign({mat, color:MATS[mat].color, t:MATS[mat].t, g:MATS[mat].g,
  perf:false, size:4, pitch:8, dist:0, vari:.6, stag:true, seed:1, vis:true}, o);

/* 밋밋한 단계 → 감성이 풍부해지는 순서 */
const PRESETS = [
  {kw:'무난하고 밋밋한', desc:'무광 회색 플라스틱 한 겹 · 빛 없음',
   light:'white', li:0, inner:layerDef('plastic',{color:'#8d8f93',t:0,g:0}), outer:layerDef('plastic',{color:'#8d8f93',t:0,g:0})},
  {kw:'무난하고 깨끗한', desc:'회색 플라스틱 위에 투명 유리 · 빛 없음',
   light:'white', li:0, inner:layerDef('plastic',{color:'#8d8f93',t:0,g:.15}), outer:layerDef('glass',{t:.85})},
  {kw:'단단하고 모던한', desc:'광택 알루미늄 코어 + 투명 유리 · 빛 없음',
   light:'white', li:0, inner:layerDef('metal',{color:'#dcdfe3',g:.6}), outer:layerDef('glass',{t:.85})},
  {kw:'모던하고 흥미로운', desc:'알루미늄 천공 + 투명 유리 · 빛 없음',
   light:'yellow', li:0, inner:layerDef('metal',{perf:true,size:4,pitch:8}), outer:layerDef('glass',{t:.82})},
  {kw:'은은하고 생기 있는', desc:'알루미늄 천공 사이로 옐로 빛이 새어 나옴',
   light:'yellow', li:75, inner:layerDef('metal',{perf:true,size:4,pitch:8}), outer:layerDef('glass',{t:.85})},
  {kw:'가볍고 안정적인', desc:'위로 커지는 천공 + 무광 유리 · 화이트',
   light:'white', li:55, inner:layerDef('metal',{perf:true,size:8,pitch:10,dist:1,vari:.95}), outer:layerDef('glass',{t:.7,g:.3})},
  {kw:'귀엽고 포근한', desc:'큰 랜덤 천공 메탈 + 패브릭 · 옐로',
   light:'yellow', li:55, inner:layerDef('metal',{perf:true,size:25,pitch:40,dist:3,vari:.8}), outer:layerDef('fabric',{t:.45})},
  {kw:'온화하고 따스함', desc:'오팔 아크릴 + 군집 천공 나무 · 옐로',
   light:'yellow', li:60, inner:layerDef('plastic',{t:.2}), outer:layerDef('wood',{t:.25,perf:true,size:6,pitch:9,dist:6,vari:.9})},
  {kw:'밝고 신비로운', desc:'오팔 아크릴 + 결이 비치는 대리석 · 옐로',
   light:'yellow', li:60, inner:layerDef('plastic',{t:.25}), outer:layerDef('marble',{t:.45,g:.9})},
  {kw:'젊고 활발한', desc:'촘촘한 천공 + 다크 블루 랜덤 천공 메탈 · 그린',
   light:'green', li:80, inner:layerDef('metal',{color:'#eef0ec',perf:true,size:3,pitch:6}), outer:layerDef('metal',{color:'#071d80',g:.6,perf:true,size:11,pitch:15,dist:3,vari:.6})},
];

const state = {
  preset:0, custom:false, light:'white', li:0, bloom:.5, gap:8, envL:.25, exp:1, bg:'black', rot:false, view:'all',
  layers:{inner:null, outer:null}
};
/* 사용자가 바꾼 값은 테마별로 유지 (브라우저에 저장) */
const STORE = 'bullet-light-cmf-v3';
const DEF_GLOBAL = {bloom:.5, gap:8, envL:.25, exp:1, bg:'black', rot:false};
let themeStates = {};
try { const d = JSON.parse(localStorage.getItem(STORE) || 'null');
  if (d){ themeStates = d.themes || {}; Object.assign(state, DEF_GLOBAL, d.global || {}); } } catch(e) {}
function saveStore(){
  try { const g = {}; for (const k in DEF_GLOBAL) g[k] = state[k];
    localStorage.setItem(STORE, JSON.stringify({themes:themeStates, global:g})); } catch(e) {}
}
function loadPreset(i){
  const saved = themeStates[i], src = saved || PRESETS[i];
  state.preset=i; state.custom=!!saved; state.light=src.light; state.li=src.li;
  state.layers.inner = structuredClone(src.inner);
  state.layers.outer = structuredClone(src.outer);
}
loadPreset(0);

/* ───────── 렌더러 / 씬 ───────── */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.localClippingEnabled = true;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30,1,.05,100);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping=true; controls.dampingFactor=.08; controls.enablePan=false;
controls.minDistance=1.6; controls.maxDistance=12; controls.maxPolarAngle=Math.PI*.5; controls.minPolarAngle=.05;
controls.autoRotateSpeed=.8;
controls.target.set(0,.98,0);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), .04).texture;

const rt = new THREE.WebGLRenderTarget(1,1,{type:THREE.HalfFloatType,samples:4});
const composer = new EffectComposer(renderer, rt);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(256,256), .5, .4, 1.1);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ───────── GLSL ───────── */
const GL_COMMON = /* glsl */`
varying vec3 vObj;
uniform float hR,hH,hOn,hPitch,hSize,hVar,hMode,hSeed,hStag;
const float KPI=3.14159265, KTAU=6.2831853;
float kH13(vec3 p){p=fract(p*.1031);p+=dot(p,p.zyx+31.32);return fract((p.x+p.y)*p.z);}
float kVN(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(mix(kH13(i),kH13(i+vec3(1,0,0)),f.x),mix(kH13(i+vec3(0,1,0)),kH13(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(kH13(i+vec3(0,0,1)),kH13(i+vec3(1,0,1)),f.x),mix(kH13(i+vec3(0,1,1)),kH13(i+vec3(1,1,1)),f.x),f.y),f.z);}
float kFbm(vec3 p){float a=.5,s=0.;for(int i=0;i<4;i++){s+=a*kVN(p);p=p*2.03+vec3(17.1,3.7,9.2);a*=.5;}return s;}
/* 표면 좌표: (둘레각, 바닥부터의 호 길이, 그 높이의 반지름) */
vec3 kSurf(vec3 p,float R,float H){
  float r=length(p.xz); float th=atan(p.z,p.x);
  if(p.y<=H) return vec3(th,p.y,R);
  float ph=atan(p.y-H,max(r,1e-6));

float kSizeF(float t,float rn,float mode,float v,vec3 q){
  if(mode<.5) return 1.;

}
/* 원형 천공: 표면 위에서 고른 간격(돔 포함)으로 배치. 반환 (구멍 마스크, 가장자리까지 거리, 구멍 반지름) */
vec3 kHoles(vec3 p,float R,float H,float on,float pitch,float size,float v,float mode,float seed,float stag,float soft){
  vec3 res=vec3(0.,1e3,0.);
  if(on<.5) return res;
  vec3 sp=kSurf(p,R,H); float th=sp.x, s=sp.y, rf=sp.z;
  float smax=H+R*KPI*.5;
  float lastRow=floor((smax-pitch*.5)/pitch)-1.;
  float row=floor(s/pitch);
  float cap=pitch*.48;
  for(int k=-1;k<=1;k++){
    float ri=row+float(k);
    if(ri<0.||ri>lastRow) continue;
    float sc=(ri+.5)*pitch;
    float rr= sc<=H ? R : R*cos((sc-H)/R);
    float n=max(1.,floor(KTAU*rr/pitch));
    float off= stag>.5 ? mod(ri,2.)*.5 : 0.;
    float ci=floor((th/KTAU)*n-off+.5);
    for(int j=-1;j<=1;j++){
      float c=ci+float(j);
      float thc=(c+off)/n*KTAU;
      float dth=mod(th-thc+KPI,KTAU)-KPI;
      vec2 d=vec2(dth*rf,s-sc);
      float rn=kH13(vec3(ri,mod(c,n),seed));
      vec3 q=vec3(cos(thc)*rr,sc,sin(thc)*rr)*3.2+seed;
      float hr=min(size*.5*kSizeF(sc/smax,rn,mode,v,q),cap);
      if(hr<.0004 || sc-hr<.035) continue;
      float e=length(d)-hr;
      if(e<res.y){res.y=e;res.z=hr;}
    }
  }
  float hrP=min(size*.5*kSizeF(1.,kH13(vec3(99.,1.,seed)),mode,v,vec3(0.,smax*3.2,0.)+seed),cap);
  if(hrP>=.0004){ float e=(smax-s)-hrP; if(e<res.y){res.y=e;res.z=hrP;} }
  res.x=1.-smoothstep(-soft,soft,res.y);
  return res;
}
vec3 kProj(vec3 p,float H,float Ri){
  float r=length(p.xz); vec2 dir=r>1e-6?p.xz/r:vec2(1.,0.);
  if(p.y<=H) return vec3(dir.x*Ri,p.y,dir.y*Ri);
  float ph=atan(p.y-H,max(r,1e-6));
  return vec3(dir.x*Ri*cos(ph),H+Ri*sin(ph),dir.y*Ri*cos(ph));
}

const GL_MAIN_UNI = /* glsl */`

uniform float uDiff,uEnvOcc;
uniform vec3 uLC;
`;
const GL_COLOR = /* glsl */`
#include <color_fragment>
vec3 kSP=kSurf(vObj,hR,hH);
vec3 kQ=vObj;
float kHgt=0., kRg=0., kAw=1.;
vec3 kAlb=vec3(1.);
float kAA=length(fwidth(vObj));
#if K_MAT==2
{            /* 메탈: 선반 가공 결 */
  float f=kSP.y*1400.;
  float fade=clamp(1.-fwidth(f)*.6,0.,1.);
  float n=mix(.5,kVN(vec3(f,cos(kSP.x)*4.,sin(kSP.x)*4.)),fade);
  kHgt+=(n-.5)*.00003; kRg+=(n-.5)*.18; kAlb*=1.-.05*n;
}
#elif K_MAT==3
{     /* 나무: 세로 결 + 물관 */
  vec3 w=vec3(kQ.x*7.,kQ.z*7.,kQ.y*.55);
  float g=kFbm(w)*9.+kFbm(w*3.1+4.)*.6;
  float r=fract(g);
  float band=smoothstep(0.,.18,r)*smoothstep(1.,.55,r);
  float fade=clamp(1.-kAA*120.,0.,1.);
  float pores=smoothstep(.65,.9,kVN(vec3(kQ.x*160.,kQ.z*160.,kQ.y*6.)))*fade;
  kAlb*=mix(.6,1.08,band)*(.92+.16*kFbm(w*5.))*(1.-.18*pores);
  kHgt+=-.00012*(1.-band)-.00008*pores;
  kRg+=(1.-band)*.12;

#elif K_MAT==4

`;
const GL_ALPHA = /* glsl */`
#include <alphamap_fragment>
#if K_HOLES
vec3 kHS=kHoles(vObj,hR,hH,hOn,hPitch,hSize,hVar,hMode,hSeed,hStag,kAA*.75+1e-5);

vec3 kHS=vec3(0.,1e3,0.);
#endif

const GL_ROUGH = /* glsl */`
#include <roughnessmap_fragment>

`;
const GL_NORMAL = /* glsl */`
#include <normal_fragment_maps>
{ vec3 dpx=dFdx(-vViewPosition), dpy=dFdy(-vViewPosition);

const GL_EMIS = /* glsl */`
#include <emissivemap_fragment>

const GL_AO = /* glsl */`
#include <aomap_fragment>

const GL_OUT = /* glsl */`
vec3 kSpec=reflectedLight.directSpecular+reflectedLight.indirectSpecular;

/* ───────── 공유 유니폼 ───────── */
const G = {uLC:{value:new THREE.Color()}, uLI:{value:.3}, uEY0:{value:EY0}, uEY1:{value:EY1}, uGlowK:{value:2.6}, uGapBlur:{value:.01}};
const holeU = R => ({hR:{value:R},hH:{value:H},hOn:{value:0},hPitch:{value:.08},hSize:{value:.04},hVar:{value:.5},hMode:{value:0},hSeed:{value:1},hStag:{value:1}});
const extU = isOuter => ({uIsOuter:{value:isOuter?1:0},uMat:{value:0},uAlpha:{value:1},uScatter:{value:0},uFres:{value:0},uPremul:{value:0},uTrans:{value:0},uRimK:{value:.26},oT:{value:0},oVis:{value:1},uDiff:{value:1},uEnvOcc:{value:1}});

function makeMat(self, other, ext, side){
  const m = new THREE.MeshPhysicalMaterial({side});
  m.defines = {K_MAT:0, K_HOLES:0, K_OHOLES:0};
  const otherMap = {oR:other.hR,oOn:other.hOn,oPitch:other.hPitch,oSize:other.hSize,oVar:other.hVar,oMode:other.hMode,oSeed:other.hSeed,oStag:other.hStag};
  m.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, self, G, ext, otherMap);
    sh.vertexShader = 'varying vec3 vObj;\n' + sh.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\nvObj = position;');
    sh.fragmentShader = GL_COMMON + GL_MAIN_UNI + sh.fragmentShader
      .replace('#include <color_fragment>', GL_COLOR)
      .replace('#include <alphamap_fragment>', GL_ALPHA)
      .replace('#include <roughnessmap_fragment>', GL_ROUGH)
      .replace('#include <normal_fragment_maps>', GL_NORMAL)
      .replace('#include <emissivemap_fragment>', GL_EMIS)
      .replace('#include <aomap_fragment>', GL_AO)
      .replace('#include <opaque_fragment>', GL_OUT)
      .replace('#include <premultiplied_alpha_fragment>', '');
  };

}
function shadowMat(Base, self, opts){
  const m = new Base(opts);

  m.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, self);
    sh.vertexShader = 'varying vec3 vObj;\n' + sh.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\nvObj = position;');
    sh.fragmentShader = GL_COMMON + sh.fragmentShader.replace(/void\s+main\s*\(\s*\)\s*\{/,
      'void main() {\n#if K_HOLES\n if(kHoles(vObj,hR,hH,hOn,hPitch,hSize,hVar,hMode,hSeed,hStag,.0005).x>.5) discard;\n#endif\n');
  };
  return m;
}

/* 셰이더 변형 키: 값이 실제로 바뀔 때만 재컴파일 */
function setDefs(m, d){
  let ch = false;
  for (const k in d) if (m.defines[k] !== d[k]){ m.defines[k] = d[k]; ch = true; }
  if (ch) m.needsUpdate = true;
}

/* ───────── 형상 ───────── */
function bulletGeo(R){
  const pts=[]; const nc=56, nd=72;
  for(let i=0;i<=nc;i++) pts.push(new THREE.Vector2(R, H*i/nc));
  for(let i=1;i<=nd;i++){const a=i/nd*Math.PI/2; pts.push(new THREE.Vector2(Math.max(R*Math.cos(a),1e-4), H+R*Math.sin(a)));}
  return new THREE.LatheGeometry(pts, 200);
}

const LY = {};
const U_in = holeU(RO-.08), U_out = holeU(RO);
function buildLayer(key, isOuter, U, other, order){
  const E = extU(isOuter);
  const front = new THREE.Mesh(bulletGeo(U.hR.value), makeMat(U, other, E, THREE.FrontSide));
  const back  = new THREE.Mesh(front.geometry, makeMat(U, other, E, THREE.BackSide));
  front.material.shadowSide = THREE.DoubleSide;
  front.customDepthMaterial = shadowMat(THREE.MeshDepthMaterial, U, {depthPacking:THREE.RGBADepthPacking});
  front.customDistanceMaterial = shadowMat(THREE.MeshDistanceMaterial, U);
  front.receiveShadow = back.receiveShadow = true;
  back.renderOrder = order; front.renderOrder = order + 2;
  scene.add(front, back);
  LY[key] = {U, E, front, back, mats:[front.material, back.material]};

buildLayer('inner', false, U_in, U_out, 2);
buildLayer('outer', true,  U_out, U_in, 1);

// 받침 링
const baseMat = new THREE.MeshPhysicalMaterial({color:'#1d1e21', metalness:.9, roughness:.38});
const base = new THREE.Mesh(new THREE.CylinderGeometry(RO+.006, RO+.012, .034, 160), baseMat);
base.position.y = .017; base.castShadow = base.receiveShadow = true; scene.add(base);
const baseIn = new THREE.Mesh(new THREE.CircleGeometry(RO, 96), baseMat);

// LED 바 (발광체)

rod.position.y = (EY0+EY1)/2; scene.add(rod);

stem.position.y = EY0/2; scene.add(stem);

// 바닥

const floor = new THREE.Mesh(new THREE.CircleGeometry(14, 96), floorMat);

// 조명
const pLight = new THREE.PointLight(0xffffff, 1, 0, 2);

key.position.set(2.4, 4.2, 2.0);

/* ───────── 상태 → 씬 반영 ───────── */
const clipPlane = new THREE.Plane(new THREE.Vector3(1,0,0), 0);
function layerPhys(L){
  const t=L.t, g=L.g; const r = {rough:.5, metal:0, alpha:1, scatter:0, fres:0, transp:false, clear:0, sheen:0, cast:true, env:1};
  switch(L.mat){
    case 'glass':   Object.assign(r,{rough:.02+(1-g)*.6, alpha:Math.min(1,.04+(1-t)*.9+(1-g)*.25), scatter:.04+(1-g)*.55+(1-t)*.15, fres:1, transp:true, cast:false, env:1.4}); break;

    case 'metal':   Object.assign(r,{rough:.08+(1-g)*.6, metal:1, env:1.6}); break;
    case 'wood':    Object.assign(r,{rough:.3+(1-g)*.5, scatter:t*1.2, clear:g>.6?(g-.6)*1.5:0}); break;
    case 'marble':  Object.assign(r,{rough:.06+(1-g)*.5, scatter:t*1.4, clear:g*.5}); break;
    case 'fabric':  Object.assign(r,{rough:.88, scatter:.3+t*.9, sheen:1, transp:true}); break;
  }
  r.T = L.mat==='metal' ? 0 : L.mat==='fabric' ? Math.min(1,.12+t*.8) : Math.min(1,(1-r.alpha)+r.alpha*r.scatter*.75);
  return r;
}
function applyScene(){
  const lc = LIGHTS[state.light].rgb, I = state.li/100;
  G.uLC.value.setRGB(lc[0],lc[1],lc[2]); G.uLI.value = I;
  pLight.color.setRGB(lc[0],lc[1],lc[2]); pLight.intensity = I*1.5;
  const k = .15 + I*6;
  rodMat.color.setRGB(lc[0]*k+.02, lc[1]*k+.02, lc[2]*k+.02);
  bloom.strength = state.bloom;
  renderer.toneMappingExposure = state.exp;
  key.intensity = state.envL*2.2;

  const B = BGS[state.bg];
  scene.background = new THREE.Color(B.bg); floorMat.color.set(B.floor);
  document.body.classList.toggle('light-bg', B.light);
  document.body.style.background = B.bg;

  // 레이어 반지름
  const Ri = RO - state.gap*SC;
  if (Math.abs(U_in.hR.value - Ri) > 1e-6){
    U_in.hR.value = Ri;
    const old = LY.inner.front.geometry; const geo = bulletGeo(Ri);
    LY.inner.front.geometry = LY.inner.back.geometry = geo; old.dispose();
  }
  const cut = state.view==='cut';
  const phys = {};
  for (const key of ['inner','outer']){
    const L = state.layers[key], ly = LY[key], U = ly.U, E = ly.E, P = layerPhys(L);
    phys[key] = P;
    U.hOn.value = L.perf?1:0; U.hPitch.value = L.pitch*SC; U.hSize.value = L.size*SC;
    U.hVar.value = L.vari; U.hMode.value = L.dist; U.hSeed.value = L.seed; U.hStag.value = L.stag?1:0;
    E.uMat.value = MATS[L.mat].idx; E.uAlpha.value = L.mat==='fabric'?1:P.alpha; E.uScatter.value = P.scatter;
    E.uFres.value = P.fres; E.uPremul.value = P.transp?1:0; E.uTrans.value = L.t;
    E.uDiff.value = L.mat==='glass' ? .08 + (1-L.g)*.9 : 1;
    for (const m of ly.mats){
      m.color.set(L.color);
      m.roughness = P.rough; m.metalness = P.metal;
      m.clearcoat = P.clear; m.clearcoatRoughness = .06;
      m.sheen = P.sheen; m.sheenRoughness = .55; m.sheenColor.set('#ffffff');
      m.ior = 1.5; m.specularIntensity = 1;
      m.envMapIntensity = state.envL*P.env*1.8 + .05;
      const needs = m.transparent!==P.transp || m.alphaToCoverage===P.transp || ((m.clippingPlanes&&m.clippingPlanes.length)?1:0)!==(cut?1:0);
      m.transparent = P.transp; m.premultipliedAlpha = P.transp; m.depthWrite = !P.transp; m.alphaToCoverage = !P.transp;
      m.clippingPlanes = cut ? [clipPlane] : null;
      if (needs) m.needsUpdate = true;
    }
    const vis = L.vis && !(key==='outer' && state.view==='inner');
    ly.front.visible = ly.back.visible = vis;
    const oHoles = key==='outer' && state.layers.inner.perf && LY.inner.front.visible ? 1 : 0;
    for (const m of ly.mats) setDefs(m, {K_MAT:MATS[L.mat].idx, K_HOLES:L.perf?1:0, K_OHOLES:oHoles});
    setDefs(ly.front.customDepthMaterial, {K_HOLES:L.perf?1:0});
    setDefs(ly.front.customDistanceMaterial, {K_HOLES:L.perf?1:0});
    ly.front.castShadow = vis && P.cast;
  }
  LY.outer.E.oT.value = phys.inner.T;
  LY.inner.E.uEnvOcc.value = LY.outer.front.visible ? .08 + .92*phys.outer.T : 1;
  LY.outer.E.oVis.value = LY.inner.front.visible ? 1 : 0;
  G.uGapBlur.value = state.gap*SC*(.15 + phys.outer.rough*1.2);

  baseMat.envMapIntensity = state.envL*2 + .1; floorMat.envMapIntensity = state.envL;
  controls.autoRotate = state.rot;
  updateTexts();
}

  <div class="sl"><label for="${k}G">광택</label><input id="${k}G" type="range" min="0" max="1" step="0.01"><output id="${k}GO"></output></div>
  <div class="hd" style="margin-top:8px"><p class="grp">천공</p><button class="pill" id="${k}Perf">천공 사용</button></div>
  <div class="box" id="${k}Box">
    <div class="sl"><label for="${k}Sz">구멍 지름</label><input id="${k}Sz" type="range" min="1" max="25" step="0.5"><output id="${k}SzO"></output></div>
    <div class="sl"><label for="${k}Pt">간격</label><input id="${k}Pt" type="range" min="3" max="40" step="0.5"><output id="${k}PtO"></output></div>
    <p class="grp">크기 분포</p>
    <div class="row" id="${k}Dist"></div>
    <div class="sl"><label for="${k}Vr">변화폭</label><input id="${k}Vr" type="range" min="0" max="1" step="0.01"><output id="${k}VrO"></output></div>
    <div class="row"><button class="pill" id="${k}Stag">엇갈림 배열</button><button class="pill" id="${k}Seed">랜덤 재배치</button></div>
  </div>`;
}
$('pIn').innerHTML = layerPane('in','안쪽 레이어');
$('pOut').innerHTML = layerPane('out','바깥 레이어');

function bindLayer(k, key){
  const L = () => state.layers[key];
  const mr = $(k+'Mat');
  for (const [id,M] of Object.entries(MATS)){
    const b = document.createElement('button'); b.className='pill'; b.textContent=M.name; b.dataset.m=id;
    b.onclick = () => { const l=L(); if(l.mat===id) return; l.mat=id; l.color=M.color; l.t=M.t; l.g=M.g; changed(); };
    mr.appendChild(b);
  }
  const dr = $(k+'Dist');
  for (const [n,v] of DISTS){
    const b=document.createElement('button'); b.className='pill'; b.textContent=n; b.dataset.d=v;
    b.onclick=()=>{L().dist=v; changed();}; dr.appendChild(b);
  }
  $(k+'Col').oninput = e => { L().color = e.target.value; changed(); };
  $(k+'ColR').onclick = () => { L().color = MATS[L().mat].color; changed(); };
  const sl = (id, prop) => $(k+id).oninput = e => { L()[prop] = +e.target.value; changed(); };
  sl('T','t'); sl('G','g'); sl('Sz','size'); sl('Pt','pitch'); sl('Vr','vari');
  $(k+'Perf').onclick = () => { L().perf = !L().perf; changed(); };
  $(k+'Stag').onclick = () => { L().stag = !L().stag; changed(); };
  $(k+'Seed').onclick = () => { L().seed = 1 + Math.floor(Math.random()*997); changed(); };
  $(k+'Vis').onclick = () => { L().vis = !L().vis; changed(); };
}
bindLayer('in','inner'); bindLayer('out','outer');

for (const [id,Lt] of Object.entries(LIGHTS)){
  const b=document.createElement('button'); b.className='pill'; b.dataset.l=id;
  b.innerHTML=`<span class="dot" style="background:${Lt.css};color:${Lt.css}"></span>${Lt.name}`;
  b.onclick=()=>{state.light=id; changed();}; $('lightRow').appendChild(b);
}
for (const [id,B] of Object.entries(BGS)){
  const b=document.createElement('button'); b.className='pill'; b.dataset.b=id; b.textContent=B.name;
  b.onclick=()=>{state.bg=id; globalChanged();}; $('bgRow').appendChild(b);
}
const gsl = (id, prop, custom=true) => $(id).oninput = e => { state[prop] = +e.target.value; custom ? changed() : globalChanged(); };
gsl('sLI','li'); gsl('sBloom','bloom',false); gsl('sGap','gap',false); gsl('sEnvL','envL',false); gsl('sExp','exp',false);
$('tRot').onclick = () => { state.rot = !state.rot; globalChanged(); };

PRESETS.forEach((p,i)=>{
  const b=document.createElement('button'); b.className='chip'; b.dataset.i=i;
  b.textContent = i+1; b.setAttribute('aria-label', `${i+1}단계 · ${p.kw}`);
  b.onclick=()=>{loadPreset(i); applyScene(); syncUI(); scrollChip();};
  $('chips').appendChild(b);
});
$('prev').onclick=()=>{loadPreset((state.preset+PRESETS.length-1)%PRESETS.length); applyScene(); syncUI(); scrollChip();};
$('next').onclick=()=>{loadPreset((state.preset+1)%PRESETS.length); applyScene(); syncUI(); scrollChip();};
$('reset').onclick = () => {
  if (!confirm('모든 테마의 조정값을 처음 상태로 되돌릴까요?')) return;
  themeStates = {}; Object.assign(state, DEF_GLOBAL);
  try { localStorage.removeItem(STORE); } catch(e) {}
  loadPreset(state.preset); applyScene(); syncUI();
};
function scrollChip(){ const c=$('chips').children[state.preset]; c && c.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'}); }

document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>{x.setAttribute('aria-selected', x===b?'true':'false'); $(x.dataset.p).hidden = x!==b;});
});

const fmt = {pct:v=>Math.round(v*100)+'%', mm:v=>(+v).toFixed(1)+' mm', f2:v=>(+v).toFixed(2)};
function setSl(id, v, out){ const el=$(id); el.value=v; if(out) $(out[0]).textContent=out[1](v); }
function syncUI(){
  document.querySelectorAll('#lightRow .pill').forEach(b=>press(b,b.dataset.l===state.light));
  document.querySelectorAll('#bgRow .pill').forEach(b=>press(b,b.dataset.b===state.bg));
  document.querySelectorAll('#chips .chip').forEach(b=>{ press(b,+b.dataset.i===state.preset); b.classList.toggle('cust', !!themeStates[b.dataset.i]); });
  setSl('sLI',state.li,['oLI',v=>v+'%']);
  setSl('sBloom',state.bloom,['oBloom',fmt.f2]);
  setSl('sGap',state.gap,['oGap',fmt.mm]);
  setSl('sEnvL',state.envL,['oEnvL',fmt.f2]);
  setSl('sExp',state.exp,['oExp',fmt.f2]);
  press($('tRot'),state.rot);
  for (const [k,key] of [['in','inner'],['out','outer']]){
    const L = state.layers[key], M = MATS[L.mat];
    document.querySelectorAll('#'+k+'Mat .pill').forEach(b=>press(b,b.dataset.m===L.mat));
    document.querySelectorAll('#'+k+'Dist .pill').forEach(b=>press(b,+b.dataset.d===L.dist));
    $(k+'Col').value = L.color;
    $(k+'TLab').textContent = M.tl;
    const isMetal = L.mat==='metal';
    $(k+'T').disabled = isMetal; $(k+'TRow').classList.toggle('dis', isMetal);
    setSl(k+'T', L.t, [k+'TO', v=>isMetal?'불투명':fmt.pct(v)]);
    setSl(k+'G', L.g, [k+'GO', fmt.pct]);
    setSl(k+'Sz', L.size, [k+'SzO', fmt.mm]);
    setSl(k+'Pt', L.pitch, [k+'PtO', fmt.mm]);
    setSl(k+'Vr', L.vari, [k+'VrO', fmt.pct]);
    press($(k+'Perf'), L.perf); $(k+'Box').classList.toggle('off', !L.perf);
    $(k+'Stag').textContent = L.stag ? '엇갈림 배열' : '격자 배열'; press($(k+'Stag'), L.stag);
    press($(k+'Vis'), L.vis); $(k+'Vis').textContent = L.vis ? '보이기' : '숨김';
    $(k+'Vr').closest('.sl').classList.toggle('dis', L.dist===0);
  }
  updateTexts();
}
let lastKw = '';
function updateTexts(){
  const li = state.layers.inner, lo = state.layers.outer, P = PRESETS[state.preset];
  const desc = L => MATS[L.mat].name + (L.perf ? ' 천공' : '');
  const lightTxt = state.li === 0 ? '빛 없음' : `${LIGHTS[state.light].name} ${state.li}%`;
  $('hdrSub').textContent = `${lightTxt} · 안 ${desc(li)} · 밖 ${desc(lo)}`;
  const kw = state.custom ? P.kw + ' · 조정됨' : P.kw;
  $('gripHint').textContent = state.custom ? '옵션을 직접 바꾼 조합입니다' : P.desc;
  const el = $('gripName');
  if (kw !== lastKw){
    const first = lastKw === ''; lastKw = kw;
    if (first) el.textContent = kw;
    else { el.classList.add('swap'); setTimeout(()=>{ el.textContent = kw; el.classList.remove('swap'); }, 160); }
  }
}

/* 시트 접기 */
const sheet = $('sheet'), grip = $('grip');
function setCollapsed(c){ sheet.classList.toggle('collapsed', c); grip.setAttribute('aria-expanded', c?'false':'true'); }
let dragY = null, dragged = false;
$('handle').addEventListener('pointerdown', e => { if(e.target.closest('.nav')) return; dragY = e.clientY; dragged = false; });
addEventListener('pointerup', e => { if(dragY===null) return; const dy = e.clientY-dragY; dragY=null;
  if (dy > 30){ setCollapsed(true); dragged = true; } else if (dy < -30){ setCollapsed(false); dragged = true; } });
grip.onclick = () => { if(dragged){ dragged=false; return; } setCollapsed(!sheet.classList.contains('collapsed')); };

/* 시점 */
let camTween = null;
function goView(pos){ camTween = {from:camera.position.clone(), to:pos, t:0}; }
const baseDist = () => camera.position.distanceTo(controls.target);
$('vFront').onclick = () => { const d=baseDist(); goView(new THREE.Vector3(0, .98+d*.12, d)); };
$('vHigh').onclick  = () => { const d=baseDist(); goView(new THREE.Vector3(d*.45, .98+d*.75, d*.5)); };
$('vLow').onclick   = () => { const d=baseDist(); goView(new THREE.Vector3(d*.6, .98-d*.1+.2, d*.78)); };

/* 레이아웃: 시트에 가려지지 않게 화면 중심 이동 */
let lastKey = '';
function layoutView(force){
  const w = innerWidth, h = innerHeight, wide = w >= 900;
  const top = sheet.getBoundingClientRect().top;
  const cover = wide ? 0 : Math.max(0, h - top);
  const head = document.querySelector('.top').getBoundingClientRect().bottom;
  const k = `${w}x${h}x${Math.round(cover)}x${Math.round(head)}`;
  if (k === lastKey && !force) return; lastKey = k;
  renderer.setSize(w, h, false); composer.setSize(w, h);
  camera.aspect = w/h;
  if (wide) camera.setViewOffset(w, h, 210, 0, w, h);
  else camera.setViewOffset(w, h, 0, (cover - head)*.5, w, h);
  camera.updateProjectionMatrix();
}
function initCamera(){
  const h = innerHeight, wide = innerWidth >= 900;
  const cover = wide ? 0 : Math.max(0, h - sheet.getBoundingClientRect().top);
  const head = document.querySelector('.top').getBoundingClientRect().bottom + 8;
  const frac = Math.max(.3, (h - cover - head)/h);
  const aspect = (wide ? innerWidth - 420 : innerWidth) / Math.max(1, h - cover - head);
  const need = Math.max(2.35, 1.3 / Math.max(.2, aspect));
  const dist = need / (2*Math.tan(THREE.MathUtils.degToRad(15))) / frac * (wide?1:1);
  const dir = new THREE.Vector3(.55, .32, 1).normalize();
  const fitW = 1.3 / (2*Math.tan(THREE.MathUtils.degToRad(15)) * innerWidth/h);   // 가로로 넘치지 않게
  camera.position.copy(controls.target).addScaledVector(dir, Math.max(fitW, Math.min(11, dist) / 1.3));  // 기존보다 30% 크게
}

/* ───────── 루프 ───────── */
const tmp = new THREE.Vector3();
function tick(){
  requestAnimationFrame(tick);
  layoutView();
  if (camTween){
    camTween.t = Math.min(1, camTween.t + .05);
    const e = 1 - Math.pow(1-camTween.t, 3);
    camera.position.lerpVectors(camTween.from, camTween.to, e);
    if (camTween.t >= 1) camTween = null;
  }
  controls.update();
  if (state.view === 'cut'){
    tmp.subVectors(controls.target, camera.position); tmp.y = 0; tmp.normalize();
    clipPlane.normal.copy(tmp); clipPlane.constant = 0;
  }
  composer.render();
}
/* ───────── 셰이더 선컴파일 ─────────
   PC(특히 Windows Chrome)는 WebGL 셰이더를 Direct3D로 변환·컴파일하느라 처음 수십 초 멈출 수 있습니다.
   1) 첫 화면에 필요한 셰이더만 먼저 컴파일하고 준비가 끝나면 화면을 엽니다.
   2) 나머지 테마의 셰이더는 백그라운드 컴파일 스레드(KHR_parallel_shader_compile)에서 미리 준비합니다. */
const parallelCompile = renderer.extensions.get('KHR_parallel_shader_compile') !== null;
const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const warmScene = new THREE.Scene();
const warmMeshes = [];
for (const k of ['inner','outer']){
  const f = LY[k].front;
  for (const sm of [f.customDepthMaterial, f.customDistanceMaterial]){
    const wm = new THREE.Mesh(f.geometry, sm); warmScene.add(wm); warmMeshes.push([wm, f]);
  }
}
function compileState(){
  const prev = renderer.getRenderTarget();
  renderer.setRenderTarget(composer.readBuffer);       // 실제 렌더와 같은 출력 설정으로 컴파일
  for (const [wm, f] of warmMeshes){ wm.geometry = f.geometry; wm.matrixWorld.copy(f.matrixWorld); }
  const mats = [...renderer.compile(scene, camera), ...renderer.compile(warmScene, camera, scene)];
  renderer.setRenderTarget(prev);
  return mats.map(m => renderer.properties.get(m).currentProgram).filter(Boolean);
}
function waitReady(progs){
  return new Promise(res => { const chk = () => progs.every(p => p.isReady()) ? res() : setTimeout(chk, 16); chk(); });
}
async function warmThemes(){
  for (let i = 0; i < PRESETS.length; i++){
    await new Promise(r => setTimeout(r, 40));
    const src = themeStates[i] || PRESETS[i];
    const snap = {light:state.light, li:state.li, inner:state.layers.inner, outer:state.layers.outer};
    state.light = src.light; state.li = src.li;
    state.layers.inner = structuredClone(src.inner); state.layers.outer = structuredClone(src.outer);
    applyScene();
    const progs = compileState();                       // 컴파일 요청만 보내고 바로 복귀
    state.light = snap.light; state.li = snap.li; state.layers.inner = snap.inner; state.layers.outer = snap.outer;
    applyScene();
    await waitReady(progs);
  }
}

loadPreset(0); syncUI(); applyScene(); layoutView(true); initCamera(); setCollapsed(true);
(async () => {
  try { await waitReady(compileState()); } catch(e) { console.warn(e); }
  requestAnimationFrame(() => {
    tick(); setTimeout(()=>$('load').classList.add('done'), 120);
    if (parallelCompile || !isMobile) setTimeout(() => warmThemes().catch(e => console.warn(e)), 400);
  });
})();
</script>
</body>
</html>
